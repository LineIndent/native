[project]
name = "buridan"
version = "0.0.3"
description = "A command line interface (CLI) for adding components and themes to your project."
requires-python = ">=3.11"
dependencies = []

readme = "cli/README.md"
license = "MIT"
authors = [
    { name = "LineIndent", email = "line.indent@gmail.com" }
]
keywords = [
    "cli",
    "ui",
    "design-system",
    "reflex",
    "components",
    "tailwind",
    "base-ui"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators"
]

[project.urls]
Homepage = "https://github.com/LineIndent/native"
Repository = "https://github.com/LineIndent/native"
Issues = "https://github.com/LineIndent/native/issues"

[dependency-groups]
dev = [
    "reflex==0.9.8",
    "pillow>=12.2.0",
    "PyYAML>=6.0.3",
    "questionary>=2.1.1",
    "google-genai",
    "beautifulsoup4>=4.15.0",
    "markdown>=3.10.2",
    "ruff>=0.15.22",
    "black",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
buridan = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["native", "cli", "components"]
